apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-app-traffic
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: microservice-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres-db
      ports:
        - protocol: TCP
          port: 5432
